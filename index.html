<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Citas — Joan Motorcar</title>
<style>
:root {
  --blue: #C0392B;
  --blue-light: #E53935;
  --blue-pale: #FADBD8;
  --green: #1E8449;
  --green-pale: #D5F5E3;
  --orange: #D35400;
  --orange-pale: #FDEBD0;
  --red: #922B21;
  --red-pale: #F5B7B1;
  --gray: #566573;
  --gray-light: #F2F3F4;
  --gray-pale: #FDFEFE;
  --border: #D5D8DC;
  --text: #1C2833;
  --text-muted: #717D7E;
  --white: #FFFFFF;
  --radius: 10px;
  --radius-sm: 6px;
  --shadow: 0 1px 4px rgba(0,0,0,0.10);
  --nav-h: 62px;
  --header-h: 54px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; background: var(--gray-light); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; color: var(--text); }
#app { display: flex; flex-direction: column; height: 100%; max-width: 680px; margin: 0 auto; background: var(--gray-light); position: relative; }

/* HEADER */
#header { background: var(--blue); color: white; height: var(--header-h); display: flex; align-items: center; padding: 0 16px; gap: 10px; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 6px rgba(0,0,0,0.2); }
#header h1 { font-size: 17px; font-weight: 600; flex: 1; }
#header-sub { font-size: 12px; opacity: 0.8; }
#btn-back { background: none; border: none; color: white; font-size: 22px; cursor: pointer; padding: 4px 8px 4px 0; display: none; }

/* MAIN */
#main { flex: 1; overflow-y: auto; padding-bottom: calc(var(--nav-h) + 8px); }

/* BOTTOM NAV */
#nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 680px; background: white; border-top: 1px solid var(--border); height: var(--nav-h); display: flex; z-index: 100; }
.nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border: none; background: none; cursor: pointer; font-size: 10px; color: var(--text-muted); padding: 6px 0; transition: color 0.15s; }
.nav-btn.active { color: var(--blue); }
.nav-btn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.nav-btn.active svg { stroke: var(--blue); }

/* CARDS */
.card { background: white; border-radius: var(--radius); box-shadow: var(--shadow); margin: 10px 12px; padding: 14px; }

/* SECTION TITLE */
.sec-title { font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; padding: 14px 16px 6px; }

/* CAPACITY BARS */
.cap-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin: 10px 12px; }
.cap-card { background: white; border-radius: var(--radius-sm); padding: 10px; box-shadow: var(--shadow); }
.cap-label { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
.cap-val { font-size: 18px; font-weight: 600; }
.cap-sub { font-size: 10px; color: var(--text-muted); margin-top: 1px; }
.bar-wrap { margin: 0 12px 4px; }
.bar-label { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-muted); margin-bottom: 3px; }
.bar-track { height: 8px; background: var(--gray-light); border-radius: 4px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 4px; transition: width 0.4s, background 0.4s; }
.bar-chapa { background: var(--blue-light); }
.bar-pintura { background: var(--green); }
.bar-cabina { background: var(--orange); }
.bar-warn { background: #E67E22; }
.bar-danger { background: var(--red); }

/* ALERT */
.alert { margin: 0 12px 4px; padding: 10px 14px; border-radius: var(--radius-sm); font-size: 13px; }
.alert-warn { background: var(--orange-pale); color: var(--orange); border-left: 3px solid var(--orange); }
.alert-danger { background: var(--red-pale); color: var(--red); border-left: 3px solid var(--red); }
.alert-ok { background: var(--green-pale); color: var(--green); border-left: 3px solid var(--green); }
.alert-info { background: var(--blue-pale); color: var(--blue); border-left: 3px solid var(--blue-light); }

/* WEEK NAV */
.week-nav { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; }
.week-nav button { background: white; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 6px 14px; font-size: 14px; cursor: pointer; color: var(--text); }
.week-nav span { font-size: 14px; font-weight: 500; }

/* JOB CARD */
.job-card { background: white; border-radius: var(--radius); box-shadow: var(--shadow); margin: 6px 12px; padding: 12px 14px; border-left: 4px solid var(--border); cursor: pointer; }
.job-card.prio-alta { border-left-color: var(--red); }
.job-card.prio-media { border-left-color: var(--blue-light); }
.job-card.prio-baja { border-left-color: var(--gray); }
.job-top { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.job-mat { font-size: 16px; font-weight: 700; letter-spacing: 1px; }
.job-veh { font-size: 13px; color: var(--text-muted); flex: 1; }
.job-badges { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 6px; }
.badge { font-size: 11px; padding: 2px 8px; border-radius: 20px; font-weight: 500; }
.badge-bar-inv { background: #FADBD8; color: #C0392B; }
.badge-bar-pro { background: #D5F5E3; color: #1E8449; }
.badge-bar-sol { background: #EBF5FB; color: #2E86C1; }
.badge-bar-gt  { background: #F4ECF7; color: #7D3C98; }
.badge-gr-agenda  { background: #D6EAF8; color: #2E86C1; }
.badge-gr-grua    { background: #FDEDEC; color: #C0392B; font-weight: 600; }
.badge-gr-pieza   { background: #FEF9E7; color: #D4AC0D; }
.badge-gr-pintura { background: #FADBD8; color: #C0392B; }
.badge-gr-otros   { background: #F2F3F4; color: #566573; }
.job-hours { display: flex; gap: 14px; font-size: 12px; color: var(--text-muted); margin-bottom: 8px; }
.job-hours span b { color: var(--text); font-weight: 600; }
.job-estado { display: flex; gap: 6px; flex-wrap: wrap; }
.est-btn { font-size: 12px; padding: 5px 10px; border-radius: 20px; border: 1px solid var(--border); background: white; cursor: pointer; color: var(--text-muted); transition: all 0.15s; }
.est-btn.active { font-weight: 600; }
.est-btn.e-espera.active { background: #F2F3F4; color: var(--gray); border-color: var(--gray); }
.est-btn.e-desm.active   { background: #FADBD8; color: #C0392B; border-color: #C0392B; }
.est-btn.e-chapa.active  { background: #D6EAF8; color: var(--blue); border-color: var(--blue-light); }
.est-btn.e-prep.active   { background: #F4ECF7; color: #7D3C98; border-color: #7D3C98; }
.est-btn.e-cabina.active { background: #FDEBD0; color: var(--orange); border-color: var(--orange); }
.est-btn.e-listo.active  { background: var(--green-pale); color: var(--green); border-color: var(--green); }
.job-nota { font-size: 12px; color: var(--orange); margin-top: 6px; }
.job-averia { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

/* FILTER TABS */
.tabs { display: flex; gap: 6px; padding: 8px 12px 4px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { font-size: 13px; padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border); background: white; cursor: pointer; white-space: nowrap; color: var(--text-muted); }
.tab.active { background: var(--blue); color: white; border-color: var(--blue); font-weight: 500; }

/* FORM */
.form-section { padding: 12px 12px 0; }
.form-group { margin-bottom: 14px; }
.form-label { font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 5px; display: block; text-transform: uppercase; letter-spacing: 0.3px; }
.form-input { width: 100%; padding: 11px 13px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 15px; color: var(--text); background: white; appearance: none; -webkit-appearance: none; outline: none; }
.form-input:focus { border-color: var(--blue-light); box-shadow: 0 0 0 3px rgba(192,57,43,0.15); }
.form-row  { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.form-row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
.form-hint { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
.form-hint.warn { color: var(--orange); }
.btn-primary { width: 100%; padding: 14px; background: var(--blue); color: white; border: none; border-radius: var(--radius); font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 4px; }
.btn-primary:active { opacity: 0.85; }
.btn-danger-sm { background: none; border: none; color: var(--red); font-size: 13px; cursor: pointer; padding: 4px 0; }

/* CLIENT ROW */
.client-row { display: flex; align-items: flex-start; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--gray-light); }
.client-avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--blue-pale); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; color: var(--blue); flex-shrink: 0; }
.client-name { font-weight: 500; font-size: 15px; }
.client-tel  { font-size: 13px; color: var(--text-muted); }
.client-mat  { font-size: 12px; color: var(--blue); margin-top: 1px; }

/* STATS ROW */
.stats-row { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin: 8px 12px; }
.stat-card { background: white; border-radius: var(--radius-sm); padding: 10px 12px; box-shadow: var(--shadow); }
.stat-val { font-size: 22px; font-weight: 700; color: var(--blue); }
.stat-lbl { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

/* MODAL */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 200; display: flex; align-items: flex-end; justify-content: center; }
.modal { background: white; border-radius: var(--radius) var(--radius) 0 0; width: 100%; max-width: 680px; max-height: 92vh; overflow-y: auto; padding: 20px 16px calc(var(--nav-h) + 20px); }
.modal-title { font-size: 17px; font-weight: 700; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
.modal-close { background: none; border: none; font-size: 22px; color: var(--text-muted); cursor: pointer; }

/* LOADING */
.loading { text-align: center; padding: 80px 24px; color: var(--text-muted); }
.spinner { font-size: 36px; display: block; margin-bottom: 12px; animation: spin 1.5s linear infinite; display: inline-block; }
@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

/* EMPTY */
.empty { text-align: center; padding: 48px 24px; color: var(--text-muted); }
.empty p { font-size: 14px; }

/* SHEETS BANNER */
.sheets-banner { margin: 8px 12px; padding: 10px 14px; background: #E8F5E9; border-radius: var(--radius-sm); border-left: 3px solid #43A047; font-size: 12px; color: #2E7D32; }
.no-sheets-banner { margin: 8px 12px; padding: 10px 14px; background: #FFF3E0; border-radius: var(--radius-sm); border-left: 3px solid #FB8C00; font-size: 12px; color: #E65100; }

/* CALENDAR */
.cal-toggle { display: flex; gap: 6px; padding: 8px 12px 4px; }
.cal-toggle button { flex: 1; padding: 8px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: white; font-size: 13px; cursor: pointer; color: var(--text-muted); }
.cal-toggle button.active { background: var(--blue); color: white; border-color: var(--blue); font-weight: 600; }
.cal-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 3px; padding: 0 12px; }
.cal-day-header { text-align: center; font-size: 11px; font-weight: 600; color: var(--text-muted); padding: 4px 0; }
.cal-cell { background: white; border-radius: 6px; padding: 5px 4px; min-height: 52px; cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,0.06); position: relative; }
.cal-cell:active { opacity: 0.7; }
.cal-cell.today { background: var(--blue-pale); }
.cal-cell.selected { background: var(--blue); color: white; }
.cal-cell.other-month { opacity: 0.35; }
.cal-day-num { font-size: 13px; font-weight: 500; text-align: center; }
.cal-cell.selected .cal-day-num { color: white; font-weight: 700; }
.cal-dot-wrap { display: flex; flex-wrap: wrap; gap: 2px; justify-content: center; margin-top: 3px; }
.cal-dot { width: 6px; height: 6px; border-radius: 50%; }
.cal-week-col { background: white; border-radius: var(--radius-sm); padding: 8px; box-shadow: var(--shadow); }
.cal-week-header { font-size: 12px; font-weight: 700; color: var(--text-muted); margin-bottom: 6px; text-align: center; }
.cal-week-header.today-col { color: var(--blue); }
.cal-week-job { font-size: 11px; padding: 4px 6px; border-radius: 4px; margin-bottom: 3px; border-left: 3px solid var(--border); background: var(--gray-light); cursor: pointer; }

/* MOVILIDAD */
.movilidad-banner { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: #EBF5FB; border: 1px solid #AED6F1; border-radius: var(--radius-sm); margin-bottom: 14px; font-size: 13px; color: #1A5276; text-decoration: none; }

@media (min-width: 520px) { .form-row3 { grid-template-columns: repeat(3,1fr); } }

/* ============================================================
   DESKTOP LAYOUT (≥ 900px)
   ============================================================ */
@media (min-width: 900px) {
  /* Grid: sidebar | (header + main) */
  #app {
    display: grid;
    grid-template-columns: 220px 1fr;
    grid-template-rows: auto 1fr;
    grid-template-areas: "nav header" "nav main";
    max-width: 100%;
    height: 100vh;
  }

  /* Sidebar nav */
  #nav {
    grid-area: nav;
    position: sticky;
    top: 0;
    height: 100vh;
    flex-direction: column;
    align-items: stretch;
    justify-content: flex-start;
    border-top: none;
    border-right: 1px solid var(--border);
    padding: 24px 10px 16px;
    gap: 2px;
    transform: none !important;
    left: auto !important;
    bottom: auto !important;
    width: 220px !important;
    max-width: 220px !important;
    background: white;
    box-shadow: 2px 0 12px rgba(0,0,0,0.05);
    overflow-y: auto;
  }
  #nav::before {
    content: 'CITAS JM';
    display: block;
    font-size: 17px;
    font-weight: 800;
    color: var(--blue);
    padding: 0 14px 20px;
    letter-spacing: 1.5px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 10px;
  }
  .nav-btn {
    flex-direction: row !important;
    justify-content: flex-start;
    gap: 12px;
    padding: 11px 14px;
    font-size: 14px;
    border-radius: var(--radius-sm);
    color: var(--text);
    transition: background 0.15s, color 0.15s;
  }
  .nav-btn svg { width: 20px; height: 20px; }
  .nav-btn:hover { background: var(--gray-light); }
  .nav-btn.active { background: var(--blue-pale); color: var(--blue); font-weight: 600; }
  .nav-btn.active svg { stroke: var(--blue); }

  /* Header */
  #header { grid-area: header; }

  /* Main content */
  #main {
    grid-area: main;
    overflow-y: auto;
    padding-bottom: 24px;
  }

  /* 2-column job cards grid */
  .jobs-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
  }

  /* Calendar wider */
  .cal-grid { gap: 5px; }
  .cal-cell { min-height: 72px; }

  /* Modal: centered, not bottom sheet */
  .modal-overlay {
    align-items: center;
    justify-content: center;
  }
  .modal {
    border-radius: var(--radius);
    max-width: 640px;
    padding-bottom: 24px;
    max-height: 88vh;
  }

  /* Dashboard: more room */
  .stats-row { grid-template-columns: repeat(4, 1fr); }
  .cap-grid   { grid-template-columns: repeat(3, 1fr); }

  /* Form: 2 columns on desktop */
  .form-section { max-width: 720px; margin: 0 auto; }
}
</style>
</head>

  <div id="header">

};

};

const barClass2 = { pro: 'badge-bar-pro', sol: 'badge-bar-sol', gt: 'badge-bar-gt', inv: 'badge-bar-inv' };

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
}

function getSemanaISO(date) {
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7));
  const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  const week = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
  return d.getUTCFullYear() + '-W' + String(week).padStart(2, '0');
}

function semanaLabel(iso) {
  const [year, w] = iso.split('-W');
  const simple = new Date(parseInt(year), 0, 1 + (parseInt(w) - 1) * 7);
  const day = simple.getDay();
  const lun = new Date(simple); lun.setDate(simple.getDate() + (day <= 1 ? 1 - day : 8 - day));
  const vie = new Date(lun); vie.setDate(lun.getDate() + 4);
  const opts = { day: 'numeric', month: 'short' };
  return `Sem ${w} · ${lun.toLocaleDateString('es', opts)} – ${vie.toLocaleDateString('es', opts)}`;
}

function offsetSemana(iso, delta) {
  const [year, w] = iso.split('-W');
  const d = new Date(parseInt(year), 0, 1 + (parseInt(w) - 1) * 7 + 3);
  d.setDate(d.getDate() + delta * 7);
  return getSemanaISO(d);
}

function semanaToMonday(iso) {
  const [year, w] = iso.split('-W');
  const simple = new Date(parseInt(year), 0, 1 + (parseInt(w) - 1) * 7);
  const day = simple.getDay();
  const lun = new Date(simple);
  lun.setDate(simple.getDate() + (day <= 1 ? 1 - day : 8 - day));
  lun.setHours(0, 0, 0, 0);
  return lun;
}

function getCitaDate(t) {
  if (t.fechaEntrada) {
    const d = new Date(t.fechaEntrada + 'T00:00:00');
    if (!isNaN(d)) return d;
  }
  return semanaToMonday(t.semana);
}

function formatDate(d) {
  return d.toLocaleDateString('es', { weekday: 'short', day: 'numeric', month: 'short' });
}

function isoDate(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${dd}`;
}

function parseRow(row) {
  return {

    matricula:         String(row['Matrícula'] || '').toUpperCase(),
    marca:             String(row['Marca'] || ''),
    modelo:            String(row['Modelo'] || ''),
    bastidor:          String(row['Bastidor'] || ''),
    or:                row['OR'] ? String(row['OR']) : null,
    cliente:           String(row['Cliente'] || ''),
    telefono:          String(row['Teléfono'] || ''),
    estado:            String(row['Estado'] || 'espera'),
    semana:            String(row['Semana'] || getSemanaISO(new Date())),
    fechaEntrada:      String(row['Fecha Entrada'] || ''),
    tipoAveria:        String(row['Tipo Avería'] || ''),
    grupoReparacion:   String(row['Grupo Reparación'] || 'agenda'),
    mecanico:          String(row['Mecánico'] || ''),
    hChapa:            parseFloat(row['H.Chapa']) || 0,
    hPintura:          parseFloat(row['H.Pintura']) || 0,
    hCabina:           parseFloat(row['H.Cabina']) || 0,
    hPresupuestadas:   parseFloat(row['H.Presupuestadas']) || 0,
    baremo:            String(row['Baremo'] || 'pro'),
    prio:              String(row['Prioridad'] || 'media'),

    movilidad:         row['Movilidad'] === true || row['Movilidad'] === 'true' || row['Movilidad'] === 'TRUE',
    fechaMovInicio:    String(row['Fecha Mov Inicio'] || ''),
    fechaMovFin:       String(row['Fecha Mov Fin'] || ''),
    aseguradora:       String(row['Aseguradora'] || ''),
    peritoNombre:      String(row['Perito'] || ''),
    peritoTel:         String(row['Perito Tel'] || ''),
    peritoEmail:       String(row['Perito Email'] || ''),
    valorHora:         parseFloat(row['Valor Hora']) || 0,
    nota:              String(row['Nota'] || ''),
    trelloCardId:      row['Trello Card ID'] ? String(row['Trello Card ID']) : null,
    fechaCreacion:     String(row['Fecha Creación'] || new Date().toISOString()),
    fechaModificacion: String(row['Fecha Modificación'] || new Date().toISOString()),
  };
}

function toRow(c) {
  return {
    'ID': c.id, 'Matrícula': c.matricula, 'Marca': c.marca, 'Modelo': c.modelo,
    'Bastidor': c.bastidor || '', 'OR': c.or || '', 'Cliente': c.cliente || '',
    'Teléfono': c.telefono || '', 'Estado': c.estado, 'Semana': c.semana,
    'Fecha Entrada': c.fechaEntrada || '',
    'Tipo Avería': c.tipoAveria || '', 'Grupo Reparación': c.grupoReparacion || '',
    'Mecánico': c.mecanico || '', 'H.Chapa': c.hChapa || 0, 'H.Pintura': c.hPintura || 0,
    'H.Cabina': c.hCabina || 0, 'H.Presupuestadas': c.hPresupuestadas || 0,
    'Baremo': c.baremo, 'Prioridad': c.prio,
    'Recambios': c.recambios ? 'true' : 'false',
    'Movilidad': c.movilidad ? 'true' : 'false',
    'Fecha Mov Inicio': c.fechaMovInicio || '',
    'Fecha Mov Fin': c.fechaMovFin || '',
    'Aseguradora': c.aseguradora || '',
    'Perito': c.peritoNombre || '',
    'Perito Tel': c.peritoTel || '',
    'Perito Email': c.peritoEmail || '',
    'Valor Hora': c.valorHora || 0, 'Nota': c.nota || '',

    'Fecha Creación': c.fechaCreacion || new Date().toISOString(),
    'Fecha Modificación': new Date().toISOString(),
  };
}

// SHEETS API
// ============================================================
async function sheetsLoad() {
  if (!USE_SHEETS()) { citas = lLoad('citas', []); return; }
  try {
    const res  = await fetch(`${SCRIPT_URL}?action=getAll&sheet=${SHEET_TAB}`);
    const json = await res.json();
    if (json.ok) { citas = json.data.map(parseRow); lSave('citas', citas); }
  } catch(e) { console.warn('Sheets load error:', e); citas = lLoad('citas', []); }
}

async function sheetsSave(cita) {
  cita.fechaModificacion = new Date().toISOString();
  const idx = citas.findIndex(c => c.id === cita.id);
  if (idx >= 0) citas[idx] = cita; else citas.push(cita);
  lSave('citas', citas);
  if (!USE_SHEETS()) return;
  const action = idx >= 0 ? 'update' : 'create';
  try {
    await fetch(SCRIPT_URL + '?action=' + action + '&sheet=' + encodeURIComponent(SHEET_TAB) + '&id=' + encodeURIComponent(cita.id) + '&data=' + encodeURIComponent(JSON.stringify(toRow(cita))));
  } catch(e) { console.warn('Sheets save error:', e); }
}

async function sheetsDelete(id) {
  citas = citas.filter(c => c.id !== id);
  lSave('citas', citas);
  if (!USE_SHEETS()) return;
  try { await fetch(SCRIPT_URL + '?action=delete&id=' + encodeURIComponent(id) + '&sheet=' + encodeURIComponent(SHEET_TAB)); }
  catch(e) { console.warn('Sheets delete error:', e); }
}

// ============================================================
// LÓGICA DE NEGOCIO
// ============================================================
function getCitaByMat(mat) {
  return citas.filter(c => c.matricula === mat.toUpperCase())
    .sort((a, b) => b.fechaCreacion.localeCompare(a.fechaCreacion))[0] || null;
}

function calcCapacidad(semana) {
  const act = citas.filter(t => t.semana === semana && t.estado !== 'listo');
  return {
    hChapa:   act.reduce((s, t) => s + (t.hChapa   || 0), 0),
    hPintura: act.reduce((s, t) => s + (t.hPintura || 0), 0),
    hCabina:  act.reduce((s, t) => s + (t.hCabina  || 0), 0),
  };
}

function pct(used, cap) { return Math.min(120, Math.round(used / cap * 100)); }

function barFillClass(fill) {
  if (fill >= 100) return 'bar-danger';
  if (fill >= 80)  return 'bar-warn';
  return '';
}

function estadoColor(e) {
  return { espera:'#95A5A6', desm:'#C0392B', chapa:'#E53935', prep:'#7D3C98', cabina:'#D35400', listo:'#1E8449' }[e] || '#95A5A6';
}

function buscarSemanaLibre(hc, hp, hcab, desde) {
  let sem = desde;
  for (let i = 0; i < 12; i++) {
    const cap = calcCapacidad(sem);
    if ((cap.hChapa+hc) <= CAP.chapa && (cap.hPintura+hp) <= CAP.pintura && (cap.hCabina+hcab) <= CAP.cabina) return sem;
    sem = offsetSemana(sem, 1);
  }
  return null;
}

  if (!nombre.trim()) return;

let busquedaTexto = '';

function renderTrabajos(el) {
  const tabs = [
    { id:'todos', lbl:'Todos' }, { id:'agenda', lbl:'Agenda' },
    { id:'grua', lbl:'Grúa/Sint.' }, { id:'pieza_fuera', lbl:'Pieza fuera' },

  ];
  let filtered;
  if (filtroTab === 'listo') filtered = citas.filter(t => t.estado === 'listo');
  else if (filtroTab === 'todos') filtered = citas.filter(t => t.estado !== 'listo');
  else filtered = citas.filter(t => t.grupoReparacion === filtroTab && t.estado !== 'listo');

      (t.aseguradora || '').toUpperCase().includes(q)
    );
  }

  filtered = [...filtered].sort((a, b) => {

    ${filtered.length === 0
      ? `<div class="empty"><p>${busquedaTexto ? 'Sin resultados para "'+busquedaTexto+'"' : 'Sin trabajos en esta categoría'}</p></div>`

    if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
  }

function cerrarModal() { document.querySelector('.modal-overlay')?.remove(); }

function setEstadoModal(id, est, btn) {
  const t = citas.find(x => x.id === id);
  if (!t) return;
  t.estado = est;
  sheetsSave(t);
  btn.closest('.modal').querySelectorAll('.est-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render(); trelloMoverTarjeta(t);
}

function updateCampo(id, campo, val) {
  const t = citas.find(x => x.id === id);
  if (!t) return;
  t[campo] = val;
  sheetsSave(t); render();
}

function moverSemanaModal(id, delta) {
  const t = citas.find(x => x.id === id);
  if (!t) return;
  t.semana = offsetSemana(t.semana, delta);
  sheetsSave(t);
  const el = document.getElementById('sem-modal-' + id);
  if (el) el.textContent = semanaLabel(t.semana);
  render();
}

function eliminarTrabajo(id) {
  if (!confirm('¿Eliminar este trabajo?')) return;
  sheetsDelete(id); cerrarModal(); render();
}

}

function toggleMovilidad() {

}

function buildMovilidadURL(mat, inicio, fin, cliente) {
  const params = new URLSearchParams();
  if (mat)     params.set('matricula', mat);
  if (inicio)  params.set('inicio', inicio);
  if (fin)     params.set('fin', fin);
  if (cliente) params.set('cliente', cliente);
  const q = params.toString();
  return MOVILIDAD_URL + (q ? '?' + q : '');
}

  const mat    = document.getElementById('f-mat')?.value?.trim() || '';
  const inicio = document.getElementById('f-mov-inicio')?.value || '';
  const fin    = document.getElementById('f-mov-fin')?.value || '';
  window.open(buildMovilidadURL(mat, inicio, fin, ''), '_blank');
}

async function buscarMatCompleto() {
  const mat = (document.getElementById('f-mat')?.value || '').toUpperCase().trim();
  if (mat.length < 3) { alert('Introduce al menos 3 caracteres de la matrícula'); return; }
  formMat = mat;

  const btn = document.getElementById('btn-buscar-mat');
  const res = document.getElementById('mat-search-results');
  const hint = document.getElementById('mat-hint');
  if (btn) { btn.textContent = '⏳'; btn.disabled = true; }
  if (res) res.innerHTML = `<div style="padding:10px 0;font-size:13px;color:var(--text-muted)">⏳ Buscando en Sheets, Expedientes y Trello…</div>`;

  const expTaller = SHEET_TAB === 'CITAS_JM' ? 'JM' : 'RM';

  // Fuentes en paralelo
  const [sheetsResult, trelloCards, expedientesResult] = await Promise.all([
    // 1. Sheets: buscar en citas locales (ya cargadas) + intentar reload fresco
    (async () => {
      // Buscar en citas ya cargadas
      const local = citas.filter(c => c.matricula === mat)
        .sort((a, b) => b.fechaCreacion.localeCompare(a.fechaCreacion));
      if (local.length > 0) return { source: 'Sheets (local)', data: local[0], all: local };
      // Si no hay local, intentar consulta fresca a Sheets
      try {
        const url = SCRIPT_URL + '?action=load&sheet=' + encodeURIComponent(SHEET_TAB);
        const r = await fetch(url); const json = await r.json();
        const rows = (json.data || []).map(parseRow).filter(c => c.matricula === mat)
          .sort((a,b) => b.fechaCreacion.localeCompare(a.fechaCreacion));
        if (rows.length > 0) return { source: 'Sheets', data: rows[0], all: rows };
      } catch(e) {}
      return null;
    })(),
    // 2. Trello: buscar tarjetas con la matrícula
    (async () => {
      try {
        const cards = await trelloAPI(`/boards/${TRELLO_BOARD_ID}/cards?fields=name,desc,id,idList`);
        return cards.filter(c => c.name.toUpperCase().includes(mat));
      } catch(e) { return []; }
    })(),
    // 3. Expedientes: buscar en EXPEDIENTES MOTORCAR v2
    (async () => {
      try {
        const url = SCRIPT_URL + '?action=loadExpedientes&taller=' + expTaller + '&mat=' + encodeURIComponent(mat);
        const r = await fetch(url); const json = await r.json();
        if (!json.ok || !json.data) return null;
        const rows = json.data.filter(row => {
          const m = String(row['MATRICULA'] || '').toUpperCase().replace(/\s/g,'');
          return m === mat || m.includes(mat);
        });
        return rows.length > 0 ? rows[0] : null;
      } catch(e) { return null; }
    })()
  ]);

  if (btn) { btn.textContent = '🔍'; btn.disabled = false; }

  // Parsear tarjeta Trello: "1234ABC - SEAT IBIZA - VIN123 - OR0427"
  function parseTrelloName(name) {
    const parts = name.split(' - ');
    return {
      marcaModelo: parts[1]?.trim() || '',
      bastidor:    parts[2]?.trim() || '',
      or:          parts[3]?.replace(/^OR/i,'').trim() || ''
    };
  }

  // Construir panel de resultados
  let html = '';
  let autoFillData = null;

  if (!sheetsResult && trelloCards.length === 0 && !expedientesResult) {
    html = `<div style="padding:8px 0;font-size:13px;color:var(--orange)">⚠ No se encontró <b>${mat}</b> en Sheets, Expedientes ni Trello — vehículo nuevo</div>`;
    if (hint) { hint.textContent = 'Vehículo nuevo — completa los datos'; hint.style.color = 'var(--orange)'; }
  } else {
    html = `<div style="margin-top:8px;border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden">`;

    // Resultado Sheets
    if (sheetsResult) {
      const d = sheetsResult.data;
      const prev = sheetsResult.all.length > 1 ? ` · ${sheetsResult.all.length} citas previas` : '';
      autoFillData = d;
      html += `
        <div style="padding:10px 14px;background:#E8F8F5;border-bottom:1px solid var(--border)">
          <div style="font-size:11px;font-weight:700;color:#1E8449;margin-bottom:4px">🗂 SHEETS${prev}</div>
          <div style="font-size:14px;font-weight:600">${d.marca} ${d.modelo}</div>
          <div style="font-size:12px;color:var(--text-muted)">${d.cliente||''}${d.telefono?' · '+d.telefono:''}${d.bastidor?' · '+d.bastidor:''}</div>
          ${d.aseguradora||d.peritoNombre ? `<div style="font-size:12px;color:var(--text-muted)">${[d.aseguradora,d.peritoNombre].filter(Boolean).join(' · ')}</div>` : ''}
        </div>`;
    }

    // Resultado Expedientes
    if (expedientesResult) {
      const exp = expedientesResult;
      const marcaMod = exp['MARCA_MODELO'] || '';
      const propietario = exp['PROPIETARIO'] || '';
      const tel = exp['TELEFONO'] || '';
      const aseg = exp['ASEGURADORA'] || '';
      const perito = exp['PERITO'] || '';
      const siniestro = exp['Nº_SINIESTRO'] || '';
      const estado = exp['ESTADO'] || '';
      const or = exp['OR'] || '';
      // Construir autoFillData desde expedientes si no hay dato de Sheets
      if (!autoFillData) {
        const mm = marcaMod.split(' ');
        autoFillData = {
          _source: 'Expedientes',
          marca: mm[0]||'', modelo: mm.slice(1).join(' ')||'',
          bastidor: exp['BASTIDOR']||'',
          cliente: propietario, telefono: tel,
          or: or, aseguradora: aseg,
          peritoNombre: perito, peritoTel:'', peritoEmail: exp['EMAIL']||''
        };
      } else {
        // Fusionar: completar campos vacíos con datos de Expedientes
        if (!autoFillData.aseguradora && aseg) autoFillData.aseguradora = aseg;
        if (!autoFillData.peritoNombre && perito) autoFillData.peritoNombre = perito;
        if (!autoFillData.bastidor && exp['BASTIDOR']) autoFillData.bastidor = exp['BASTIDOR'];
      }
      html += `
        <div style="padding:10px 14px;background:#FEF9E7;border-bottom:1px solid var(--border)">
          <div style="font-size:11px;font-weight:700;color:#7D6608;margin-bottom:4px">📋 EXPEDIENTES${expTaller} ${estado?'· '+estado:''}</div>
          ${marcaMod ? `<div style="font-size:14px;font-weight:600">${marcaMod}</div>` : ''}
          <div style="font-size:12px;color:var(--text-muted)">${[propietario, tel].filter(Boolean).join(' · ')}</div>
          <div style="font-size:12px;color:var(--text-muted)">${[aseg, perito, siniestro?'Sin: '+siniestro:'', or?'OR: '+or:''].filter(Boolean).join(' · ')}</div>
        </div>`;
    }

    // Resultados Trello
    trelloCards.slice(0,3).forEach(card => {
      const p = parseTrelloName(card.name);
      html += `
        <div style="padding:10px 14px;background:#EBF5FB;border-bottom:1px solid var(--border)">
          <div style="font-size:11px;font-weight:700;color:#1A5276;margin-bottom:4px">🃏 TRELLO</div>
          <div style="font-size:13px;font-weight:500">${card.name}</div>
          ${card.desc ? `<div style="font-size:11px;color:var(--text-muted);margin-top:2px;white-space:pre-wrap;max-height:48px;overflow:hidden">${card.desc.substring(0,120)}</div>` : ''}
        </div>`;
      // Si no hay dato de Sheets ni Expedientes, usar Trello para autorellenar lo que se pueda
      if (!autoFillData && p.marcaModelo) {
        const mm = p.marcaModelo.split(' ');
        autoFillData = { marca: mm[0]||'', modelo: mm.slice(1).join(' ')||'', bastidor: p.bastidor, cliente:'', telefono:'', or: p.or, aseguradora:'', peritoNombre:'', peritoTel:'', peritoEmail:'' };
      }
    });

    html += `</div>`;

    // Botón usar datos
    if (autoFillData) {
      html += `<button onclick="aplicarDatosVehiculo()" type="button"
        style="width:100%;margin-top:8px;padding:10px;background:var(--blue);color:white;border:none;border-radius:var(--radius-sm);font-size:14px;font-weight:600;cursor:pointer">
        ✓ Usar estos datos
      </button>`;
    }
  }

  if (res) res.innerHTML = html;
  _matSearchData = autoFillData;

  // Si hay datos de Sheets, autorellenar directo
  if (sheetsResult) aplicarDatosVehiculo();
}

let _matSearchData = null;

function aplicarDatosVehiculo() {
  const d = _matSearchData;
  if (!d) return;
  setVal('f-marca',    d.marca     || '');
  setVal('f-modelo',   d.modelo    || '');
  setVal('f-bastidor', d.bastidor  || '');
  setVal('f-clinombre',d.cliente   || '');
  setVal('f-clitel',   d.telefono  || '');
  if (d.or)           setVal('f-or', d.or);
  if (d.aseguradora)  setVal('f-aseguradora', d.aseguradora);
  if (d.peritoNombre) { setVal('f-perito', d.peritoNombre); setVal('f-perito-tel', d.peritoTel||''); setVal('f-perito-email', d.peritoEmail||''); }
  // Marcar campos como rellenados
  ['f-marca','f-modelo','f-bastidor','f-clinombre','f-clitel'].forEach(id => {
    const inp = document.getElementById(id);
    if (inp && inp.value) { inp.style.background = '#f0fff4'; }
  });
  formMatData = d;
  const sec = document.getElementById('veh-section');
  if (sec) sec.style.display = 'block';
  const hint = document.getElementById('mat-hint');
  if (hint) { hint.textContent = `✓ Datos cargados desde ${d.semana ? 'Sheets · última cita '+d.semana : (d._source || 'Trello')}`; hint.style.color = 'var(--green)'; }
  const res = document.getElementById('mat-search-results');
  if (res) res.innerHTML = '';
}

function buscarMat(val) {
  formMat = val.toUpperCase();
  const hint = document.getElementById('mat-hint');
  const sec  = document.getElementById('veh-section');
  if (formMat.length < 3) { sec.style.display = 'none'; return; }
  sec.style.display = 'block';
  formMatData = getCitaByMat(formMat);
  if (formMatData) {
    hint.textContent = `✓ Vehículo encontrado — última cita ${formMatData.semana}`;
    hint.style.color = 'var(--green)';
    setVal('f-marca', formMatData.marca); setVal('f-modelo', formMatData.modelo);
    setVal('f-bastidor', formMatData.bastidor); setVal('f-clinombre', formMatData.cliente);
    setVal('f-clitel', formMatData.telefono);
    ['f-marca','f-modelo','f-bastidor','f-clinombre','f-clitel'].forEach(id => {
      const inp = document.getElementById(id);
      if (inp) { inp.readOnly = true; inp.style.background = '#f0fff4'; }
    });
  } else {
    hint.textContent = 'Vehículo nuevo — completa los datos';
    hint.style.color = 'var(--orange)';
    formMatData = null;
    ['f-marca','f-modelo','f-bastidor','f-clinombre','f-clitel'].forEach(id => {
      const inp = document.getElementById(id);
      if (inp) { inp.readOnly = false; inp.style.background = ''; }
    });
  }
}

function setVal(id, val) { const el = document.getElementById(id); if (el) el.value = val || ''; }
function getVal(id) { const el = document.getElementById(id); return el ? el.value.trim() : ''; }

function onBaremoChange() {
  const bar = getVal('f-baremo');
  document.getElementById('baremo-warn').style.display = bar === 'inv' ? 'block' : 'none';
}

function estimarCabina() {
  const hp = parseFloat(document.getElementById('f-hp').value) || 0;
  document.getElementById('f-hcab').value = Math.round(hp * RATIO_CAB * 2) / 2;
  autosumarHoras();
}

function autosumarHoras() {
  const hc   = parseFloat(document.getElementById('f-hc')?.value)   || 0;
  const hp   = parseFloat(document.getElementById('f-hp')?.value)   || 0;
  const hcab = parseFloat(document.getElementById('f-hcab')?.value) || 0;
  const total = Math.round((hc + hp + hcab) * 2) / 2;
  const el = document.getElementById('f-hpres');
  if (el) el.value = total;
  actualizarCapHint();
}

function actualizarCapHint() {
  const hc   = parseFloat(getVal('f-hc'))   || 0;
  const hp   = parseFloat(getVal('f-hp'))   || 0;
  const hcab = parseFloat(getVal('f-hcab')) || 0;
  const cap  = calcCapacidad(formSemanaVal);
  const msgs = [];
  if (pct(cap.hChapa+hc, CAP.chapa) > 100)    msgs.push(`Chapa al ${pct(cap.hChapa+hc,CAP.chapa)}%`);
  if (pct(cap.hCabina+hcab, CAP.cabina) > 100) msgs.push('Cabina saturada — considera otra semana');
  const hint = document.getElementById('cap-hint');
  if (hint) { hint.textContent = msgs.join(' · '); hint.style.color = msgs.length ? 'var(--red)' : ''; }
}

async function confirmarCita() {
  const mat = formMat;
  if (!mat || mat.length < 3) { alert('Introduce la matrícula'); return; }
  const marca  = getVal('f-marca');
  const modelo = getVal('f-modelo');
  if (!marca || !modelo) { alert('Completa marca y modelo'); return; }

  const grupo  = getVal('f-grupo') || 'agenda';
  const baremo = getVal('f-baremo');
  const nota   = getVal('f-nota') || (baremo === 'inv' ? 'Baremo revisable — negociar al cierre' : '');
  const hc     = parseFloat(getVal('f-hc'))    || 0;
  const hp     = parseFloat(getVal('f-hp'))    || 0;
  const hcab   = parseFloat(getVal('f-hcab'))  || 0;
  const hpres  = parseFloat(getVal('f-hpres')) || 0;
  const fechaEntrada = getVal('f-fecha') || isoDate(new Date());
  const aseguradora  = getVal('f-aseguradora');
  const peritoNombre = getVal('f-perito');
  const peritoTel    = getVal('f-perito-tel');
  const peritoEmail  = getVal('f-perito-email');
  const movilidad = document.getElementById('f-movilidad')?.checked || false;
  const fechaMovInicio = movilidad ? (getVal('f-mov-inicio') || '') : '';
  const fechaMovFin    = movilidad ? (getVal('f-mov-fin')    || '') : '';

  if (hc > 0 || hp > 0 || hcab > 0) {
    const cap = calcCapacidad(formSemanaVal);
    const noQueda = (cap.hChapa+hc) > CAP.chapa || (cap.hPintura+hp) > CAP.pintura || (cap.hCabina+hcab) > CAP.cabina;
    if (noQueda) {
      const semLibre = buscarSemanaLibre(hc, hp, hcab, formSemanaVal);
      let msg = `Sin hueco en ${semanaLabel(formSemanaVal)}.\n\n1 — Meter igualmente\n`;
      if (semLibre) msg += `2 — Mover a ${semanaLabel(semLibre)}\n`;
      msg += '3 — Cancelar';
      const resp = prompt(msg, semLibre ? '2' : '1');
      if (!resp || resp === '3') return;
      if (resp === '2' && semLibre) formSemanaVal = semLibre;
    }
  }

  const cita = {
    id: uid(), matricula: mat, marca, modelo,
    bastidor: getVal('f-bastidor'), or: getVal('f-or') || null,
    cliente: getVal('f-clinombre'), telefono: getVal('f-clitel'),
    estado: 'espera', semana: formSemanaVal, fechaEntrada,
    tipoAveria: getVal('f-averia'), grupoReparacion: grupo,
    mecanico: getVal('f-mecanico'),
    hChapa: hc, hPintura: hp, hCabina: hcab, hPresupuestadas: hpres,
    baremo, prio: getVal('f-prio'),
    recambios: document.getElementById('f-rec')?.checked || false,
    aseguradora, peritoNombre, peritoTel, peritoEmail,
    movilidad, fechaMovInicio, fechaMovFin,
    valorHora: 0, nota,
    trelloCardId: null,
    fechaCreacion: new Date().toISOString(),
    fechaModificacion: new Date().toISOString(),
  };

  await sheetsSave(cita);
  if (cita.peritoNombre) savePerito(cita.peritoNombre, cita.peritoTel, cita.peritoEmail);
  formMat = ''; formMatData = null;
  showTrelloPrompt(cita);
}

function renderVehiculos(el) {
  const matrMap = {};
  citas.forEach(c => {
    if (!matrMap[c.matricula]) matrMap[c.matricula] = { ...c, count: 0 };
    matrMap[c.matricula].count++;
  });
  const vehs = Object.values(matrMap).sort((a,b) => a.matricula.localeCompare(b.matricula));
  el.innerHTML = `
    <div class="sec-title">Vehículos registrados — ${vehs.length}</div>
    <div class="card">
      ${vehs.length === 0 ? '<div class="empty"><p>Sin vehículos aún</p></div>' :

          <div class="client-row">
            <div class="client-avatar">${v.matricula.slice(0,2)}</div>

              <div class="client-tel">${v.marca} ${v.modelo}${v.bastidor ? ' · ' + v.bastidor : ''}</div>

              <div style="font-size:11px;color:var(--text-muted);margin-top:2px">${v.count} OR(s) · última semana ${v.semana}</div>
            </div>
            <a href="https://drive.google.com/drive/search?q=${encodeURIComponent(v.matricula)}" target="_blank" style="font-size:18px;text-decoration:none">📁</a>
          </div>`).join('')}
    </div>
    <div style="height:10px"></div>
  `;
}

function renderCalendario(el) {
  const MES  = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const DIAS = ['L','M','X','J','V','S','D'];

  let navHtml = '';
  if (calView === 'month') {
    navHtml = `<div class="week-nav">
      <button onclick="calNav(-1)">‹</button>
      <span style="font-weight:600">${MES[calDate.getMonth()]} ${calDate.getFullYear()}</span>
      <button onclick="calNav(1)">›</button>
    </div>`;
  } else if (calView === 'week') {
    const lun = getWeekMonday(calDate);
    const vie = new Date(lun); vie.setDate(lun.getDate() + 6);
    navHtml = `<div class="week-nav">
      <button onclick="calNav(-1)">‹</button>
      <span style="font-weight:600">${lun.toLocaleDateString('es',{day:'numeric',month:'short'})} – ${vie.toLocaleDateString('es',{day:'numeric',month:'short',year:'numeric'})}</span>
      <button onclick="calNav(1)">›</button>
    </div>`;
  } else {
    navHtml = `<div class="week-nav">
      <button onclick="calNav(-1)">‹</button>
      <span style="font-weight:600">${calDate.toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</span>
      <button onclick="calNav(1)">›</button>
    </div>`;
  }

  const toggleHtml = `<div class="cal-toggle">
    <button class="${calView==='month'?'active':''}" onclick="setCalView('month')">Mes</button>
    <button class="${calView==='week'?'active':''}"  onclick="setCalView('week')">Semana</button>
    <button class="${calView==='day'?'active':''}"   onclick="setCalView('day')">Día</button>
  </div>`;

  let contentHtml = '';
  if (calView === 'month')      contentHtml = buildCalMonth();
  else if (calView === 'week')  contentHtml = buildCalWeek();
  else                          contentHtml = buildCalDay();

  el.innerHTML = navHtml + toggleHtml + contentHtml + '<div style="height:10px"></div>';
}

function setCalView(v) { calView = v; render(); }

function calNav(d) {
  if (calView === 'month') {
    calDate = new Date(calDate.getFullYear(), calDate.getMonth() + d, 1);
  } else if (calView === 'week') {
    calDate = new Date(calDate); calDate.setDate(calDate.getDate() + d * 7);
  } else {
    calDate = new Date(calDate); calDate.setDate(calDate.getDate() + d);
  }
  render();
}

function calSelectDay(y, m, d) {
  calDate = new Date(y, m, d);
  calView = 'day';
  render();
}

function getWeekMonday(d) {
  const date = new Date(d);
  const dow = date.getDay();
  const diff = dow === 0 ? -6 : 1 - dow;
  date.setDate(date.getDate() + diff);
  date.setHours(0,0,0,0);
  return date;
}

function buildCalMonth() {
  const y = calDate.getFullYear();
  const m = calDate.getMonth();
  const today = new Date(); today.setHours(0,0,0,0);
  const firstDay = new Date(y, m, 1);
  const lastDay  = new Date(y, m + 1, 0);

  let startDow = firstDay.getDay() - 1;
  if (startDow < 0) startDow = 6;

  let html = `<div class="cal-grid" style="margin-bottom:4px">`;
  ['L','M','X','J','V','S','D'].forEach(d => {
    html += `<div class="cal-day-header">${d}</div>`;
  });
  html += '</div><div class="cal-grid">';

  for (let i = 0; i < startDow; i++) html += `<div></div>`;

  for (let d = 1; d <= lastDay.getDate(); d++) {
    const date = new Date(y, m, d);
    const isToday = date.getTime() === today.getTime();
    const isSelected = calDate.getDate() === d && calDate.getMonth() === m && calDate.getFullYear() === y && calView !== 'month';

    const citasDay = citas.filter(t => {
      const td = getCitaDate(t);
      return td.getFullYear() === y && td.getMonth() === m && td.getDate() === d;
    });

    const dotColors = citasDay.map(t => estadoColor(t.estado)).slice(0, 4);
    const dotsHtml = dotColors.length ? `<div class="cal-dot-wrap">${dotColors.map(c => `<div class="cal-dot" style="background:${c}"></div>`).join('')}</div>` : '';

    html += `<div class="cal-cell ${isToday?'today':''} ${isSelected?'selected':''}" onclick="calSelectDay(${y},${m},${d})">
      <div class="cal-day-num">${d}</div>
      ${dotsHtml}
      ${citasDay.length > 4 ? `<div style="font-size:9px;text-align:center;color:var(--text-muted)">+${citasDay.length}</div>` : ''}
    </div>`;
  }

  html += '</div>';
  return html;
}

function buildCalWeek() {
  const lun = getWeekMonday(calDate);
  const today = new Date(); today.setHours(0,0,0,0);
  const diasSem = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];

  let html = `<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:0 12px">`;

  for (let i = 0; i < 7; i++) {
    const d = new Date(lun); d.setDate(lun.getDate() + i);
    const isToday = d.getTime() === today.getTime();
    const citasDay = citas.filter(t => {
      const td = getCitaDate(t);
      return td.toDateString() === d.toDateString();
    });

    html += `<div class="cal-week-col">
      <div class="cal-week-header ${isToday?'today-col':''}" style="${isToday?'color:var(--blue);font-weight:700;':''}">
        <div>${diasSem[i]}</div>
        <div style="font-size:16px;font-weight:${isToday?'700':'400'}">${d.getDate()}</div>
      </div>
      ${citasDay.map(t => `
        <div class="cal-week-job" style="border-left-color:${estadoColor(t.estado)}" onclick="abrirTrabajo('${t.id}')">
          <div style="font-weight:700">${t.matricula}</div>
          <div style="color:var(--text-muted)">${t.marca} ${t.modelo}</div>
        </div>`).join('')}
    </div>`;
  }

  html += '</div>';
  return html;
}

function buildCalDay() {
  const today = new Date(); today.setHours(0,0,0,0);
  const isToday = calDate.getTime() === today.getTime();

  const citasDay = citas.filter(t => {
    const td = getCitaDate(t);
    return td.toDateString() === calDate.toDateString();
  }).sort((a,b) => { const p={alta:0,media:1,baja:2}; return p[a.prio]-p[b.prio]; });

  let html = `<div style="padding:0 12px">`;
  if (citasDay.length === 0) {
    html += `<div class="empty" style="padding:40px 24px">
      <div style="font-size:36px;margin-bottom:8px">📅</div>
      <p>Sin trabajos programados para este día</p>
      <button onclick="showView('nueva')" style="margin-top:16px;padding:10px 20px;background:var(--blue);color:white;border:none;border-radius:var(--radius);font-size:14px;cursor:pointer">+ Nueva cita</button>
    </div>`;
  } else {
    html += `<div class="sec-title" style="padding:10px 0 6px">${citasDay.length} trabajo(s) programado(s)</div>`;
    citasDay.forEach(t => {
      const movStr = t.movilidad ? '<span style="font-size:11px;color:#2E86C1;margin-left:4px">🚗</span>' : '';
      html += `<div class="job-card prio-${t.prio}" onclick="abrirTrabajo('${t.id}')">
        <div class="job-top">
          <span class="job-mat">${t.matricula}</span>
          <span class="job-veh">${t.marca} ${t.modelo}${t.cliente?' · '+t.cliente:''}</span>
          ${movStr}
        </div>
        <div class="job-badges">
          <span class="badge" style="background:${estadoColor(t.estado)};color:white">${estLbl[t.estado]}</span>
          ${t.grupoReparacion ? `<span class="badge ${grupoClass[t.grupoReparacion]||''}">${grupoLbl[t.grupoReparacion]||t.grupoReparacion}</span>` : ''}
          ${t.or ? `<span class="badge" style="background:var(--gray-light);color:var(--text-muted)">OR${t.or}</span>` : ''}
        </div>
        ${t.tipoAveria ? `<div class="job-averia">🔍 ${t.tipoAveria}</div>` : ''}
        ${t.nota ? `<div class="job-nota">${t.nota}</div>` : ''}
      </div>`;
    });
  }
  html += '</div>';
  return html;
}

// ============================================================
// TRELLO
// ============================================================
const TRELLO_NAME_TO_ESTADO = {
  'vehiculos en el taller': 'espera',
  'coches en el taller con golpe - pendiente de compañia': 'espera',
  'coches pendiente cita': 'espera',
  'pendiente de desmontar': 'desm',
  'reparando chapa': 'chapa', 'varillero': 'chapa', 'listo de chapa': 'chapa',
  'aparejado': 'prep', 'preparación pintura': 'prep', 'preparacion pintura': 'prep',
  'pintados': 'cabina',
  'montaje': 'listo', 'limpieza': 'listo', 'control de calidad': 'listo',
  'coche listo': 'listo', 'cliente avisado': 'listo', 'entregado cliente': 'listo',
};

async function trelloAPI(path, method = 'GET', body = null) {
  const sep = path.includes('?') ? '&' : '?';
  const url = `https://api.trello.com/1${path}${sep}key=${TRELLO_KEY}&token=${TRELLO_TOKEN}`;
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(url, opts);
  if (!res.ok) { const txt = await res.text().catch(()=>''); throw new Error(`Trello ${res.status}: ${txt}`); }
  return res.json();
}

async function trelloEnsureLists() {
  if (Object.keys(_trelloListMap).length > 0) return { map: _trelloListMap, rev: _trelloRevMap };
  const lists = await trelloAPI(`/boards/${TRELLO_BOARD_ID}/lists?fields=name,id`);
  const rev = {};
  lists.forEach(l => {
    const key = l.name.toLowerCase().trim();
    const estado = TRELLO_NAME_TO_ESTADO[key];
    if (estado && !rev[l.id]) rev[l.id] = estado;
  });
  _trelloListMap = TRELLO_LIST_IDS;
  _trelloRevMap  = rev;
  return { map: TRELLO_LIST_IDS, rev };
}

function updateSyncStatus() {
  const el = document.getElementById('trello-status');
  if (el) el.textContent = trelloStatus || '';
}

async function trelloSync() {
  if (trelloSyncing) return;
  trelloSyncing = true;
  trelloStatus = '⏳ Sincronizando Trello…';
  _trelloListMap = {}; _trelloRevMap = {};
  updateSyncStatus();
  try {
    const { rev } = await trelloEnsureLists();
    const cards = await trelloAPI(`/boards/${TRELLO_BOARD_ID}/cards?fields=name,idList,id`);
    let cambios = 0;
    cards.forEach(card => {
      const estado = rev[card.idList];
      if (!estado) return;
      let t = citas.find(x => x.trelloCardId === card.id);
      if (!t) {
        const m = card.name.match(/^([A-Z0-9]{4,10})/i);
        if (m) { const mat = m[1].toUpperCase(); t = citas.find(x => x.matricula === mat && !x.trelloCardId); if (t) t.trelloCardId = card.id; }
      }
      if (t && t.estado !== estado) { t.estado = estado; cambios++; }
    });
    if (cambios > 0) citas.filter(x => x.trelloCardId).forEach(x => sheetsSave(x));
    const hora = new Date().toLocaleTimeString('es', { hour:'2-digit', minute:'2-digit' });
    trelloStatus = `✓ Trello · ${hora}${cambios ? ' ('+cambios+' cambios)' : ''}`;
  } catch(e) { trelloStatus = `⚠ Trello: ${e.message}`; console.error(e); }
  trelloSyncing = false;
  updateSyncStatus(); render();
}

// Devuelve el lunes de la semana ISO (semana "2026-W24") o de fechaEntrada
function getMondayOfSemana(semana, fechaEntrada) {
  if (semana && /^\d{4}-W\d{2}$/.test(semana)) {
    const [yr, wk] = semana.split('-W').map(Number);
    const jan4 = new Date(yr, 0, 4);
    const startW1 = new Date(jan4);
    startW1.setDate(jan4.getDate() - ((jan4.getDay() || 7) - 1));
    const monday = new Date(startW1);
    monday.setDate(startW1.getDate() + (wk - 1) * 7);
    return monday;
  }
  if (fechaEntrada) {
    const d = new Date(fechaEntrada + 'T00:00:00');
    const dow = d.getDay() || 7;
    d.setDate(d.getDate() - dow + 1);
    return d;
  }
  const d = new Date();
  const dow = d.getDay() || 7;
  d.setDate(d.getDate() - dow + 1);
  return d;
}

// Busca o crea la lista de Trello con nombre DD/MM/YYYY del lunes de la semana
async function trelloFindOrCreateWeekList(semana, fechaEntrada) {
  const monday = getMondayOfSemana(semana, fechaEntrada);
  const dd = String(monday.getDate()).padStart(2,'0');
  const mm = String(monday.getMonth()+1).padStart(2,'0');
  const yyyy = monday.getFullYear();
  const listName = `${dd}/${mm}/${yyyy}`;
  const lists = await trelloAPI(`/boards/${TRELLO_BOARD_ID}/lists?fields=name,id`);
  const existing = lists.find(l => l.name.trim() === listName);
  if (existing) return existing.id;
  // No existe → crearla al final (más reciente a la derecha)
  const newList = await trelloAPI('/lists', 'POST', { name: listName, idBoard: TRELLO_BOARD_ID, pos: 'bottom' });
  return newList.id;
}

const _trelloCreating = new Set(); // bloqueo anti-duplicado por ID de cita

async function trelloCrearTarjeta(t) {
  try {
    // 1. Si ya tiene ID asignado → no crear de nuevo
    if (t.trelloCardId) {
      trelloStatus = `✓ Tarjeta ya existe (${t.matricula})`; updateSyncStatus(); return;
    }
    // 2. Bloqueo: si ya hay una petición en curso para esta cita, abortar
    if (_trelloCreating.has(t.id)) {
      trelloStatus = `⏳ Ya creando tarjeta (${t.matricula})…`; updateSyncStatus(); return;
    }
    _trelloCreating.add(t.id);
    const listId = await trelloFindOrCreateWeekList(t.semana, t.fechaEntrada);
    if (!listId) return;
    const mat = t.matricula.toUpperCase();
    const allCards = await trelloAPI(`/boards/${TRELLO_BOARD_ID}/cards?fields=name,id,idList`);
    const orNum = t.or ? t.or.toString().replace(/^OR/i,'') : null;
    const byMat = allCards.filter(c => c.name.toUpperCase().includes(mat));
    if (byMat.length > 0) {
      // Buscar por OR primero, si no hay OR o no coincide → usar la primera por matrícula
      let match = null;
      if (orNum) match = byMat.find(c => { const m = c.name.match(/OR(\d+)/i); return m && m[1] === orNum; });
      if (!match) match = byMat[0]; // vincula por matrícula si solo hay una o como fallback
      t.trelloCardId = match.id; sheetsSave(t);
      if (match.idList !== listId) await trelloAPI(`/cards/${match.id}`, 'PUT', { idList: listId });
      trelloStatus = `✓ Tarjeta vinculada (${mat})`; updateSyncStatus(); return;
    }
    const orSuffix = t.or ? ` - OR${t.or}` : '';
    const name = `${mat} - ${t.marca} ${t.modelo} - ${t.bastidor||'VIN'}${orSuffix}`;
    const movStr = t.movilidad ? `\n🚗 Coche sustitución: ${t.fechaMovInicio||''}${t.fechaMovFin?' → '+t.fechaMovFin:''}` : '';
    const desc = [
      t.cliente ? `Cliente: ${t.cliente}${t.telefono?' · '+t.telefono:''}` : '',
      t.fechaEntrada ? `Entrada: ${t.fechaEntrada}` : '',
      t.tipoAveria ? `Avería: ${t.tipoAveria}` : '',
      t.grupoReparacion ? `Grupo: ${grupoLbl[t.grupoReparacion]||t.grupoReparacion}` : '',
      t.mecanico ? `Operario: ${t.mecanico}` : '',
      `Chapa: ${t.hChapa}h | Pintura: ${t.hPintura}h | Cabina: ${t.hCabina}h`,
      t.hPresupuestadas ? `H. Presup.: ${t.hPresupuestadas}h` : '',
      `Baremo: ${barLbl[t.baremo]||t.baremo} | Prioridad: ${t.prio}`,
      t.aseguradora ? `🏢 Aseguradora: ${t.aseguradora}` : '',
      t.peritoNombre ? `🕵️ Perito: ${t.peritoNombre}${t.peritoTel?' · '+t.peritoTel:''}${t.peritoEmail?' · '+t.peritoEmail:''}` : '',
      t.nota ? `Nota: ${t.nota}` : '',
      `Semana: ${t.semana}`,
      movStr,
      `📁 Drive: https://drive.google.com/drive/search?q=${encodeURIComponent(mat)}`,
    ].filter(Boolean).join('\n');
    const card = await trelloAPI('/cards', 'POST', { name, desc, idList: listId });
    t.trelloCardId = card.id; sheetsSave(t);
    const hora = new Date().toLocaleTimeString('es', { hour:'2-digit', minute:'2-digit' });
    trelloStatus = `✓ Tarjeta creada · ${hora}`;
    updateSyncStatus();
  } catch(e) {
    console.error('Trello crear tarjeta:', e);
    trelloStatus = `⚠ Trello: ${e.message}`;
    updateSyncStatus();
  } finally {
    _trelloCreating.delete(t.id); // liberar bloqueo siempre
  }
}

async function trelloMoverTarjeta(t) {
  if (!t.trelloCardId) { trelloCrearTarjeta(t); return; }
  try {
    const { map } = await trelloEnsureLists();
    const listId = map[t.estado];
    if (!listId) return;
    await trelloAPI(`/cards/${t.trelloCardId}`, 'PUT', { idList: listId });
    const hora = new Date().toLocaleTimeString('es', { hour:'2-digit', minute:'2-digit' });
    trelloStatus = `✓ Trello actualizado · ${hora}`; updateSyncStatus();
  } catch(e) { console.error('Trello mover tarjeta:', e); }
}

async function crearEnTrelloCard(id) {
  const t = citas.find(x => x.id === id);
  if (!t) return;
  await trelloCrearTarjeta(t); render();
}

async function crearEnTrelloModal(id, btn) {
  const t = citas.find(x => x.id === id);
  if (!t) return;
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Creando…'; }
  await trelloCrearTarjeta(t);
  cerrarModal(); showModalTrabajo(id);
}

  isLoading = true; render();
  await sheetsLoad();
  isLoading = false; render();
}
